[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Next.js API routes worden automatisch als serverless functions gedeployd
# door @netlify/plugin-nextjs — geen aparte [functions] sectie nodig
