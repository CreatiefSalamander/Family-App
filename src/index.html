<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family-App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"><\/script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0B0F1A;--bg2:#111827;--bg3:#1a2235;--bg4:#1f2d45;
      --border:#1e2d45;--text:#f1f5ff;--text2:#8fa4c8;--text3:#4d6480;
      --accent:#6366f1;--accent2:#818cf8;--accent-bg:rgba(99,102,241,.12);
      --green:#22c55e;--green-bg:rgba(34,197,94,.12);
      --red:#ef4444;--red-bg:rgba(239,68,68,.12);
      --amber:#f59e0b;--amber-bg:rgba(245,158,11,.12);
      --r-card:16px;--r-btn:12px;--r-badge:8px;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;}
    body{overscroll-behavior:none;}
    #app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);}
    .screen{display:none;flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:80px;animation:fadeIn .2s ease;}
    .screen.active{display:block;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .screen::-webkit-scrollbar{width:4px}
    .screen::-webkit-scrollbar-track{background:transparent}
    .screen::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

    /* LOGIN */
    #screen-login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:40px 24px;position:relative;overflow:hidden;}
    .login-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=800&q=80') center/cover no-repeat;opacity:.12;}
    .login-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,transparent 30%,transparent 70%,var(--bg) 100%);}
    .login-content{position:relative;z-index:1;width:100%;max-width:360px;text-align:center;}
    .login-logo{width:72px;height:72px;background:var(--accent-bg);border:1px solid var(--accent);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 0 40px rgba(99,102,241,.3);}
    .login-logo iconify-icon{font-size:36px;color:var(--accent2);}
    .login-title{font-size:32px;font-weight:700;margin-bottom:8px;letter-spacing:-.5px;}
    .login-sub{color:var(--text2);font-size:15px;margin-bottom:48px;}
    .login-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-card);padding:24px;margin-bottom:16px;text-align:left;}
    .login-card label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
    .login-card input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:15px;margin-bottom:16px;transition:border-color .2s;}
    .login-card input:last-child{margin-bottom:0;}
    .login-card input:focus{outline:none;border-color:var(--accent);}

    /* BUTTONS */
    .btn-primary{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--r-btn);padding:14px 24px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn-primary:hover{background:var(--accent2);}
    .btn-primary:active{transform:scale(.97);}
    .btn-ghost{width:100%;background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:var(--r-btn);padding:12px 24px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;}
    .btn-ghost:hover{background:var(--bg4);color:var(--text);}
    .btn-ghost:active{transform:scale(.97);}
    .login-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--text3);font-size:13px;}
    .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border);}

    /* HEADER */
    .app-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px;position:sticky;top:0;z-index:10;background:var(--bg);}
    .header-logo{font-size:18px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
    .header-logo iconify-icon{color:var(--accent);font-size:22px;}
    .header-actions{display:flex;align-items:center;gap:8px;}
    .icon-btn{width:40px;height:40px;background:var(--bg2);border:none;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:var(--text2);font-size:20px;}
    .icon-btn:hover{background:var(--bg3);color:var(--text);}
    .icon-btn:active{transform:scale(.95);}
    .sync-badge{font-size:18px;cursor:default;display:inline-block;}
    .sync-badge.syncing{animation:spin 1s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* CARDS */
    .card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-card);padding:20px;margin:0 16px 16px;}
    .card-glow{box-shadow:0 0 20px rgba(99,102,241,.15);}
    .card-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
    .card-title a{font-size:13px;color:var(--accent2);text-decoration:none;font-weight:500;text-transform:none;letter-spacing:0;}

    /* BALANCE */
    .balance-card{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:1px solid var(--border);border-radius:var(--r-card);padding:24px 20px 20px;margin:8px 16px 16px;box-shadow:0 0 20px rgba(99,102,241,.1);}
    .balance-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .balance-amount{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;letter-spacing:-1px;margin-bottom:20px;line-height:1.1;}
    .balance-amount.hidden{filter:blur(8px);user-select:none;}
    .balance-badges{display:flex;gap:10px;}
    .balance-badge{flex:1;background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;}
    .balance-badge iconify-icon{font-size:18px;}
    .balance-badge.income iconify-icon{color:var(--green);}
    .balance-badge.expense iconify-icon{color:var(--red);}
    .balance-badge-info{flex:1;}
    .balance-badge-label{font-size:11px;color:var(--text2);margin-bottom:2px;}
    .balance-badge-amount{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;}
    .balance-badge.income .balance-badge-amount{color:var(--green);}
    .balance-badge.expense .balance-badge-amount{color:var(--red);}

    /* STATS */
    .stat-row{display:flex;gap:12px;padding:0 16px;margin-bottom:16px;}
    .stat-card{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-card);padding:16px;}
    .stat-label{font-size:12px;color:var(--text2);margin-bottom:8px;font-weight:500;}
    .stat-value{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;}
    .stat-value.positive{color:var(--green);}
    .stat-value.negative{color:var(--red);}
    .stat-icon{font-size:22px;color:var(--text3);margin-bottom:8px;display:block;}

    /* DONUT */
    .donut-wrapper{display:flex;align-items:center;gap:20px;}
    .donut{width:100px;height:100px;border-radius:50%;flex-shrink:0;position:relative;}
    .donut-center{position:absolute;inset:16px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-direction:column;}
    .donut-center-label{font-size:10px;color:var(--text2);}
    .donut-center-value{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;}
    .donut-legend{flex:1;display:flex;flex-direction:column;gap:8px;}
    .legend-item{display:flex;align-items:center;gap:8px;}
    .legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .legend-name{flex:1;font-size:13px;color:var(--text2);}
    .legend-amount{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;}
    .legend-pct{font-size:11px;color:var(--text3);min-width:32px;text-align:right;}

    /* TRANSACTIONS */
    .tx-list{display:flex;flex-direction:column;gap:2px;}
    .tx-group-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:12px 20px 6px;}
    .tx-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;transition:background .15s;border-radius:10px;}
    .tx-item:hover{background:var(--bg2);}
    .tx-item:active{background:var(--bg3);}
    .tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
    .tx-info{flex:1;min-width:0;}
    .tx-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tx-cat{font-size:12px;color:var(--text2);}
    .tx-right{text-align:right;flex-shrink:0;}
    .tx-amount{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;}
    .tx-amount.income{color:var(--green);}
    .tx-amount.expense{color:var(--red);}
    .tx-date{font-size:11px;color:var(--text3);}

    /* SEARCH */
    .search-bar{padding:12px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:5;}
    .search-input-wrap{position:relative;}
    .search-input-wrap iconify-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:18px;pointer-events:none;}
    .search-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:11px 16px 11px 44px;color:var(--text);font-family:inherit;font-size:15px;}
    .search-input:focus{outline:none;border-color:var(--accent);}
    .search-input::placeholder{color:var(--text3);}
    .filter-chips{display:flex;gap:8px;padding:8px 16px 12px;overflow-x:auto;}
    .filter-chips::-webkit-scrollbar{display:none;}
    .chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .15s;}
    .chip:hover{border-color:var(--accent);color:var(--text);}
    .chip.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent2);}

    /* ADD */
    .add-header{padding:16px 20px;}
    .type-toggle{display:flex;background:var(--bg2);border-radius:12px;padding:4px;margin-bottom:8px;}
    .type-btn{flex:1;padding:9px;border-radius:9px;border:none;background:transparent;color:var(--text2);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;}
    .type-btn.active-expense{background:var(--red-bg);color:var(--red);}
    .type-btn.active-income{background:var(--green-bg);color:var(--green);}
    .amount-input-wrap{display:flex;align-items:center;gap:8px;padding:16px 20px;background:var(--bg2);border-radius:var(--r-card);margin:0 16px 16px;border:1px solid var(--border);}
    .euro-sign{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;color:var(--text3);}
    .amount-input{flex:1;background:transparent;border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:700;width:100%;min-width:0;}
    .amount-input:focus{outline:none;}
    .amount-input::placeholder{color:var(--text3);}
    .form-group{padding:0 16px 16px;}
    .form-label{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:block;}
    .form-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--text);font-family:inherit;font-size:15px;transition:border-color .2s;}
    .form-input:focus{outline:none;border-color:var(--accent);}
    .form-input::placeholder{color:var(--text3);}
    .cat-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
    .cat-scroll::-webkit-scrollbar{display:none;}
    .cat-chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;min-width:72px;background:var(--bg2);border:2px solid var(--border);border-radius:14px;cursor:pointer;transition:all .15s;flex-shrink:0;}
    .cat-chip:hover{border-color:var(--accent);}
    .cat-chip.selected{border-color:var(--accent);background:var(--accent-bg);}
    .cat-chip iconify-icon{font-size:24px;}
    .cat-chip span{font-size:11px;color:var(--text2);white-space:nowrap;}
    .cat-chip.selected span{color:var(--accent2);}
    .photo-upload{border:2px dashed var(--border);border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg2);}
    .photo-upload:hover{border-color:var(--accent);background:var(--accent-bg);}
    .photo-upload iconify-icon{font-size:32px;color:var(--text3);display:block;margin-bottom:8px;}
    .photo-upload p{font-size:13px;color:var(--text2);}
    .photo-preview{position:relative;border-radius:14px;overflow:hidden;}
    .photo-preview img{width:100%;height:160px;object-fit:cover;display:block;}
    .photo-remove{position:absolute;top:8px;right:8px;width:32px;height:32px;background:rgba(0,0,0,.7);border:none;border-radius:50%;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .btn-save{width:calc(100% - 32px);margin:0 16px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-btn);padding:16px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn-save:active{transform:scale(.97);}

    /* BUDGET */
    .month-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;}
    .month-nav button{width:36px;height:36px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
    .month-nav button:hover{background:var(--bg3);color:var(--text);}
    .month-label{font-size:17px;font-weight:700;}
    .budget-overview{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-card);padding:20px;margin:0 16px 16px;}
    .budget-overview-labels{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:10px;}
    .budget-overview-amounts{display:flex;justify-content:space-between;margin-bottom:12px;}
    .budget-overview-total{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;}
    .budget-overview-spent{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--text2);}
    .progress-bar-bg{height:8px;background:var(--border);border-radius:4px;overflow:hidden;}
    .progress-bar-fill{height:100%;border-radius:4px;transition:width 1s ease-out;}
    .progress-bar-fill.green{background:var(--green);}
    .progress-bar-fill.amber{background:var(--amber);}
    .progress-bar-fill.red{background:var(--red);}
    .budget-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-card);padding:16px 20px;margin:0 16px 12px;cursor:pointer;transition:all .15s;}
    .budget-card:hover{background:var(--bg3);}
    .budget-card-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    .budget-cat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .budget-cat-info{flex:1;}
    .budget-cat-name{font-size:15px;font-weight:600;}
    .budget-cat-sub{font-size:12px;color:var(--text2);}
    .budget-amounts{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-top:8px;}
    .budget-amounts span:last-child{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--text);}

    /* SETTINGS */
    .settings-section{margin:0 16px 20px;}
    .settings-section-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;padding:0 4px;}
    .settings-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin-bottom:2px;}
    .settings-item iconify-icon{font-size:20px;color:var(--text2);flex-shrink:0;}
    .settings-item-info{flex:1;}
    .settings-item-name{font-size:15px;font-weight:500;}
    .settings-item-sub{font-size:12px;color:var(--text2);}
    .toggle{width:44px;height:26px;background:var(--border);border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none;}
    .toggle.on{background:var(--accent);}
    .toggle::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;}
    .toggle.on::after{transform:translateX(18px);}
    .profile-avatar{width:64px;height:64px;border-radius:20px;background:var(--accent-bg);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--accent2);flex-shrink:0;}
    .btn-danger{width:100%;background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,.3);border-radius:var(--r-btn);padding:14px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;}
    .btn-danger:hover{background:rgba(239,68,68,.2);}
    .btn-danger:active{transform:scale(.97);}
    .connection-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:6px;margin-top:8px;}
    .connection-status.ok{background:var(--green-bg);color:var(--green);}
    .connection-status.error{background:var(--red-bg);color:var(--red);}
    .connection-status.testing{background:var(--amber-bg);color:var(--amber);}

    /* BOTTOM NAV */
    .bottom-nav{display:flex;background:var(--bg2);border-top:1px solid var(--border);padding:8px 0 max(8px, env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:20;}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;cursor:pointer;border:none;background:transparent;color:var(--text3);font-family:inherit;font-size:11px;font-weight:500;transition:color .15s;}
    .nav-item iconify-icon{font-size:22px;transition:all .15s;}
    .nav-item:hover{color:var(--text2);}
    .nav-item.active{color:var(--accent2);}
    .nav-item.active iconify-icon{filter:drop-shadow(0 0 6px rgba(129,140,248,.6));}
    .nav-item.add-btn iconify-icon{font-size:32px;color:var(--accent);background:var(--accent-bg);border-radius:50%;padding:4px;}
    .nav-item.add-btn.active iconify-icon{color:#fff;background:var(--accent);}

    /* MODALS */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-end;}
    .modal-overlay.open{display:flex;}
    .modal{width:100%;max-width:430px;margin:0 auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:12px 0 0;animation:slideUp .3s ease;max-height:85dvh;overflow-y:auto;}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px;}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:0 20px 16px;}
    .modal-title{font-size:18px;font-weight:700;}
    .modal-close{width:32px;height:32px;background:var(--bg3);border:none;border-radius:50%;color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .modal-body{padding:0 20px 20px;}
    .tx-detail-icon{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px;}
    .tx-detail-amount{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;text-align:center;margin-bottom:4px;}
    .tx-detail-name{font-size:18px;font-weight:600;text-align:center;margin-bottom:4px;}
    .tx-detail-date{font-size:13px;color:var(--text2);text-align:center;margin-bottom:20px;}
    .tx-detail-photo{border-radius:12px;overflow:hidden;margin-bottom:16px;}
    .tx-detail-photo img{width:100%;max-height:200px;object-fit:cover;display:block;}
    .tx-detail-desc{background:var(--bg3);border-radius:10px;padding:12px;font-size:14px;color:var(--text2);margin-bottom:16px;}
    .modal-actions{display:flex;gap:10px;}

<script>
// ============================================================
// CONFIG
// ============================================================
const SUPABASE_URL = 'https://lttxjfrtfrjnlazmbcyq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_SLofdkgzrdibQzeP5v_bew_bIBDTFAD';

// ============================================================
// STATE
// ============================================================
let supabaseClient = null, isOnline = false, currentUser = null, deviceKey = null;
let transactions = [], budgets = [];
let activeTab = 'home', txFilter = 'all', balanceVisible = true;
let currentMonth = new Date(), photoBase64 = null;
let selectedCategory = 'Boodschappen', selectedType = 'expense';

const CATS = [
  {id:'Boodschappen',label:'Boodschappen',icon:'ph:shopping-cart-bold',color:'#6366f1'},
  {id:'Eten',label:'Eten',icon:'ph:fork-knife-bold',color:'#f59e0b'},
  {id:'Transport',label:'Transport',icon:'ph:car-bold',color:'#3b82f6'},
  {id:'Wonen',label:'Wonen',icon:'ph:house-bold',color:'#22c55e'},
  {id:'Gezondheid',label:'Gezondheid',icon:'ph:pill-bold',color:'#ec4899'},
  {id:'Vrije tijd',label:'Vrije tijd',icon:'ph:confetti-bold',color:'#8b5cf6'},
  {id:'Kleding',label:'Kleding',icon:'ph:t-shirt-bold',color:'#06b6d4'},
  {id:'Abonnementen',label:'Abonnementen',icon:'ph:device-mobile-bold',color:'#f97316'},
  {id:'Zakelijk',label:'Zakelijk',icon:'ph:briefcase-bold',color:'#84cc16'},
  {id:'Overig',label:'Overig',icon:'ph:package-bold',color:'#94a3b8'},
  {id:'Salaris',label:'Salaris',icon:'ph:money-bold',color:'#22c55e'},
];

// ============================================================
// INIT
// ============================================================
(function(){
  deviceKey = localStorage.getItem('family_app_device_key') || crypto.randomUUID();
  localStorage.setItem('family_app_device_key', deviceKey);
  document.getElementById('add-date').value = new Date().toISOString().split('T')[0];
  buildCatChips();
  updateBudgetMonthLabel();
  try{
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    isOnline = true; setSyncIcon('ok');
  }catch(e){ setSyncIcon('offline'); }
  const saved = localStorage.getItem('family_app_user');
  if(saved){ currentUser = JSON.parse(saved); setTimeout(enterApp,200); }
})();

// ============================================================
// LOGIN
// ============================================================
function doLogin(){
  const name = document.getElementById('login-name').value.trim()||'Abdul';
  const email = document.getElementById('login-email').value.trim();
  currentUser={name,email};
  localStorage.setItem('family_app_user',JSON.stringify(currentUser));
  enterApp();
}
function doLoginGuest(){ currentUser={name:'Gast',email:''}; enterApp(); }
function enterApp(){
  document.getElementById('screen-login').style.display='none';
  const m = document.getElementById('main-app');
  m.style.display='flex'; m.style.flexDirection='column'; m.style.flex='1'; m.style.overflow='hidden';
  document.getElementById('profile-name').textContent=currentUser.name;
  document.getElementById('profile-email').textContent=currentUser.email||'Lokale modus';
  document.getElementById('profile-avatar').textContent=currentUser.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  loadData();
}
async function doLogout(){
  localStorage.removeItem('family_app_user');
  if(supabaseClient){ try{ await supabaseClient.auth.signOut(); }catch(e){} }
  location.reload();
}

// ============================================================
// DATA
// ============================================================
async function loadData(){
  setSyncIcon('sync');
  const txR=localStorage.getItem('family_app_transactions');
  const bdR=localStorage.getItem('family_app_budgets');
  transactions = txR?JSON.parse(txR):[];
  budgets = bdR?JSON.parse(bdR):defaultBudgets();
  if(isOnline){
    try{
      const{data:td}=await supabaseClient.from('transactions').select('*').order('date',{ascending:false});
      if(td&&td.length>0){ transactions=td; saveLocal(); }
      const{data:bd}=await supabaseClient.from('budgets').select('*');
      if(bd&&bd.length>0){ budgets=bd; saveLocal(); }
      setSyncIcon('ok');
    }catch(e){ setSyncIcon('offline'); }
  }else{ setSyncIcon('offline'); }
  renderAll();
}
function saveLocal(){
  localStorage.setItem('family_app_transactions',JSON.stringify(transactions));
  localStorage.setItem('family_app_budgets',JSON.stringify(budgets));
}
function defaultBudgets(){
  return[
    {id:'b1',category:'Boodschappen',monthly_limit:400},
    {id:'b2',category:'Eten',monthly_limit:200},
    {id:'b3',category:'Transport',monthly_limit:150},
    {id:'b4',category:'Wonen',monthly_limit:1200},
    {id:'b5',category:'Vrije tijd',monthly_limit:100},
  ];
}
function setSyncIcon(s){
  const el=document.getElementById('sync-icon'); if(!el)return;
  el.classList.remove('syncing');
  if(s==='ok'){el.textContent='☁️';el.title='Gesynchroniseerd';}
  else if(s==='sync'){el.textContent='⏳';el.title='Bezig...';el.classList.add('syncing');}
  else{el.textContent='📵';el.title='Offline';}
}

// ============================================================
// NAVIGATION
// ============================================================
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const s=document.getElementById('screen-'+tab); if(s)s.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));
  if(tab==='home')renderHome();
  if(tab==='transactions')renderTransactions();
  if(tab==='budget')renderBudget();
}

// ============================================================
// RENDER
// ============================================================
function renderAll(){ renderHome(); renderTransactions(); renderBudget(); }

function renderHome(){
  const now=new Date(), m=now.getMonth(), y=now.getFullYear();
  const mTx=transactions.filter(t=>{const d=new Date(t.date);return d.getMonth()===m&&d.getFullYear()===y;});
  const inc=mTx.filter(t=>t.type==='income').reduce((s,t)=>s+parseFloat(t.amount),0);
  const exp=mTx.filter(t=>t.type==='expense').reduce((s,t)=>s+parseFloat(t.amount),0);
  const net=inc-exp;
  const bal=transactions.reduce((s,t)=>s+(t.type==='income'?1:-1)*parseFloat(t.amount),0);
  document.getElementById('balance-amount').textContent=fmt(bal);
  document.getElementById('total-income').textContent=fmt(inc);
  document.getElementById('total-expense').textContent=fmt(exp);
  document.getElementById('stat-netto').textContent=fmt(Math.abs(net));
  document.getElementById('stat-netto').className='stat-value '+(net>=0?'positive':'negative');
  document.getElementById('stat-count').textContent=mTx.length;
  renderDonut(mTx);
  const rec=[...transactions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);
  document.getElementById('recent-list').innerHTML=rec.length?rec.map(txHTML).join(''):'<div class="empty-state" style="padding:24px 0;"><iconify-icon icon="ph:receipt-bold"></iconify-icon><p>Nog geen transacties</p></div>';
}

function renderDonut(txList){
  const exp=txList.filter(t=>t.type==='expense');
  const total=exp.reduce((s,t)=>s+parseFloat(t.amount),0);
  const colors=['#6366f1','#f59e0b','#3b82f6','#22c55e','#ec4899','#8b5cf6','#f97316'];
  const byCat={};
  exp.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+parseFloat(t.amount);});
  document.getElementById('donut-total').textContent='€'+Math.round(total);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!cats.length){
    document.getElementById('donut-chart').style.background='conic-gradient(var(--border) 0deg 360deg)';
    document.getElementById('donut-legend').innerHTML='<div class="legend-item"><div class="legend-dot" style="background:var(--border)"></div><div class="legend-name" style="color:var(--text3)">Geen data</div></div>';
    return;
  }
  let g='',ang=0;
  cats.forEach((c,i)=>{const p=(c[1]/total)*360;g+=`${colors[i%colors.length]} ${ang}deg ${ang+p}deg, `;ang+=p;});
  g+=`var(--border) ${ang}deg 360deg`;
  document.getElementById('donut-chart').style.background=`conic-gradient(${g})`;
  document.getElementById('donut-legend').innerHTML=cats.map((c,i)=>`
    <div class="legend-item">
      <div class="legend-dot" style="background:${colors[i%colors.length]}"></div>
      <div class="legend-name">${c[0]}</div>
      <div class="legend-amount">${fmt(c[1])}</div>
      <div class="legend-pct">${Math.round(c[1]/total*100)}%</div>
    </div>`).join('');
}

function renderTransactions(){
  const search=document.getElementById('tx-search')?.value.toLowerCase()||'';
  let fl=[...transactions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(txFilter!=='all'){
    if(txFilter==='income'||txFilter==='expense') fl=fl.filter(t=>t.type===txFilter);
    else fl=fl.filter(t=>t.category===txFilter);
  }
  if(search) fl=fl.filter(t=>t.description?.toLowerCase().includes(search)||t.category?.toLowerCase().includes(search));
  const c=document.getElementById('tx-full-list'); if(!c)return;
  if(!fl.length){c.innerHTML='<div class="empty-state"><iconify-icon icon="ph:receipt-bold"></iconify-icon><h3>Geen transacties</h3><p>Voeg je eerste transactie toe</p></div>';return;}
  const grps={};
  fl.forEach(t=>{if(!grps[t.date])grps[t.date]=[];grps[t.date].push(t);});
  c.innerHTML=Object.entries(grps).map(([d,ts])=>`<div class="tx-group-label">${dateLabel(d)}</div>${ts.map(txHTML).join('')}`).join('');
}

function txHTML(t){
  const cat=CATS.find(c=>c.id===t.category)||CATS[CATS.length-1];
  return`<div class="tx-item" onclick="openTxDetail('${t.id}')">
    <div class="tx-icon" style="background:${cat.color}22;color:${cat.color}"><iconify-icon icon="${cat.icon}"></iconify-icon></div>
    <div class="tx-info"><div class="tx-name">${t.description||cat.label}</div><div class="tx-cat">${cat.label}</div></div>
    <div class="tx-right"><div class="tx-amount ${t.type}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div><div class="tx-date">${shortDate(t.date)}</div></div>
  </div>`;
}

function renderBudget(){
  const m=currentMonth.getMonth(), y=currentMonth.getFullYear();
  const mTx=transactions.filter(t=>{const d=new Date(t.date);return d.getMonth()===m&&d.getFullYear()===y&&t.type==='expense';});
  const totB=budgets.reduce((s,b)=>s+parseFloat(b.monthly_limit),0);
  const totS=mTx.reduce((s,t)=>s+parseFloat(t.amount),0);
  const pct=totB>0?Math.min(100,(totS/totB)*100):0;
  document.getElementById('budget-total').textContent=fmt(totB);
  document.getElementById('budget-spent').textContent=fmt(totS);
  const bar=document.getElementById('budget-bar');
  setTimeout(()=>{bar.style.width=pct+'%';},100);
  bar.className='progress-bar-fill '+(pct<70?'green':pct<90?'amber':'red');
  document.getElementById('budget-list').innerHTML=budgets.map(b=>{
    const sp=mTx.filter(t=>t.category===b.category).reduce((s,t)=>s+parseFloat(t.amount),0);
    const bp=parseFloat(b.monthly_limit)>0?Math.min(100,(sp/parseFloat(b.monthly_limit))*100):0;
    const bc=bp<70?'green':bp<90?'amber':'red';
    const cat=CATS.find(c=>c.id===b.category)||CATS[CATS.length-1];
    return`<div class="budget-card">
      <div class="budget-card-header">
        <div class="budget-cat-icon" style="background:${cat.color}22;color:${cat.color}"><iconify-icon icon="${cat.icon}"></iconify-icon></div>
        <div class="budget-cat-info"><div class="budget-cat-name">${cat.label}</div><div class="budget-cat-sub">${fmt(sp)} van ${fmt(b.monthly_limit)}</div></div>
        <span style="font-size:13px;font-weight:600;color:var(--${bc==='green'?'green':bc==='amber'?'amber':'red'})">${Math.round(bp)}%</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill ${bc}" style="width:${bp}%"></div></div>
      <div class="budget-amounts"><span>Besteed</span><span>${fmt(sp)}</span></div>
    </div>`;
  }).join('');
  const sel=document.getElementById('budget-cat-select');
  if(sel) sel.innerHTML=CATS.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');
}

// ============================================================
// ADD TRANSACTION
// ============================================================
function buildCatChips(){
  const c=document.getElementById('cat-scroll'); if(!c)return;
  c.innerHTML=CATS.map(cat=>`
    <div class="cat-chip ${cat.id===selectedCategory?'selected':''}" onclick="selectCat('${cat.id}',this)">
      <iconify-icon icon="${cat.icon}" style="color:${cat.color}"></iconify-icon>
      <span>${cat.label.split(' ')[0]}</span>
    </div>`).join('');
}
function selectCat(id,el){
  selectedCategory=id;
  document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}
function setType(t){
  selectedType=t;
  document.getElementById('type-expense').className='type-btn '+(t==='expense'?'active-expense':'');
  document.getElementById('type-income').className='type-btn '+(t==='income'?'active-income':'');
}
function handlePhoto(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    photoBase64=ev.target.result;
    document.getElementById('photo-area').innerHTML=`<div class="photo-preview"><img src="${photoBase64}"><button class="photo-remove" onclick="removePhoto()"><iconify-icon icon="ph:x-bold"></iconify-icon></button></div>`;
  };
  r.readAsDataURL(f);
}
function removePhoto(){
  photoBase64=null;
  document.getElementById('photo-area').innerHTML='<div class="photo-upload" onclick="document.getElementById(\'photo-input\').click()"><iconify-icon icon="ph:camera-bold"></iconify-icon><p>Tik om foto te maken of te uploaden</p></div>';
  document.getElementById('photo-input').value='';
}
async function saveTransaction(){
  const amount=parseFloat(document.getElementById('add-amount').value);
  const desc=document.getElementById('add-desc').value.trim();
  const date=document.getElementById('add-date').value;
  if(!amount||amount<=0){showToast('Voer een geldig bedrag in');return;}
  if(!date){showToast('Selecteer een datum');return;}
  const tx={id:crypto.randomUUID(),created_at:new Date().toISOString(),amount,type:selectedType,description:desc||selectedCategory,category:selectedCategory,date,photo_base64:photoBase64,device_key:deviceKey};
  transactions.unshift(tx); saveLocal(); renderAll();
  document.getElementById('add-amount').value='';
  document.getElementById('add-desc').value='';
  document.getElementById('add-date').value=new Date().toISOString().split('T')[0];
  removePhoto(); setType('expense');
  showToast('✓ Transactie opgeslagen');
  switchTab('home');
  if(isOnline&&supabaseClient){try{await supabaseClient.from('transactions').upsert(tx);setSyncIcon('ok');}catch(e){setSyncIcon('offline');}}
}

// ============================================================
// DETAIL MODAL
// ============================================================
function openTxDetail(id){
  const t=transactions.find(x=>x.id===id); if(!t)return;
  const cat=CATS.find(c=>c.id===t.category)||CATS[CATS.length-1];
  document.getElementById('tx-detail-body').innerHTML=`
    <div class="tx-detail-icon" style="background:${cat.color}22;color:${cat.color}"><iconify-icon icon="${cat.icon}"></iconify-icon></div>
    <div class="tx-detail-amount" style="color:${t.type==='income'?'var(--green)':'var(--red)'}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div>
    <div class="tx-detail-name">${t.description||cat.label}</div>
    <div class="tx-detail-date">${cat.label} · ${fullDate(t.date)}</div>
    ${t.photo_base64?`<div class="tx-detail-photo"><img src="${t.photo_base64}"></div>`:''}
    ${t.description?`<div class="tx-detail-desc">${t.description}</div>`:''}
    <div class="modal-actions">
      <button class="btn-edit" onclick="closeModal('modal-tx-detail')">Sluiten</button>
      <button class="btn-delete" onclick="deleteTx('${t.id}')"><iconify-icon icon="ph:trash-bold"></iconify-icon> Verwijderen</button>
    </div>`;
  document.getElementById('modal-tx-detail').classList.add('open');
}
async function deleteTx(id){
  transactions=transactions.filter(t=>t.id!==id); saveLocal(); renderAll();
  closeModal('modal-tx-detail'); showToast('Transactie verwijderd');
  if(isOnline&&supabaseClient){try{await supabaseClient.from('transactions').delete().eq('id',id);}catch(e){}}
}

// BUDGET
// ============================================================
function changeMonth(d){ currentMonth.setMonth(currentMonth.getMonth()+d); updateBudgetMonthLabel(); renderBudget(); }
function updateBudgetMonthLabel(){
  const M=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
  const el=document.getElementById('budget-month-label');
  if(el)el.textContent=M[currentMonth.getMonth()]+' '+currentMonth.getFullYear();
}
function openAddBudget(){ renderBudget(); document.getElementById('modal-budget').classList.add('open'); }
async function saveBudget(){
  const cat=document.getElementById('budget-cat-select').value;
  const lim=parseFloat(document.getElementById('budget-limit').value);
  if(!lim||lim<=0){showToast('Voer een geldig bedrag in');return;}
  const i=budgets.findIndex(b=>b.category===cat);
  if(i>=0)budgets[i].monthly_limit=lim;
  else budgets.push({id:crypto.randomUUID(),category:cat,monthly_limit:lim,device_key:deviceKey});
  saveLocal(); renderBudget(); closeModal('modal-budget'); showToast('✓ Budget opgeslagen');
  if(isOnline&&supabaseClient){try{await supabaseClient.from('budgets').upsert(budgets);}catch(e){}}
}

// ============================================================
// SETTINGS
// ============================================================
async function testConnection(){
  const url=document.getElementById('supa-url').value.trim();
  const key=document.getElementById('supa-key').value.trim();
  const s=document.getElementById('conn-status');
  s.style.display='flex'; s.className='connection-status testing'; s.textContent='Testen...';
  try{
    const cl=supabase.createClient(url,key);
    const{error}=await cl.from('transactions').select('id').limit(1);
    if(error)throw error;
    s.className='connection-status ok'; s.textContent='✓ Verbinding geslaagd';
    supabaseClient=cl; isOnline=true;
    await loadData();
  }catch(e){ s.className='connection-status error'; s.textContent='✗ '+(e.message||'Mislukt'); }
}
function confirmDeleteAll(){ document.getElementById('modal-confirm').classList.add('open'); }
async function deleteAllData(){
  transactions=[]; budgets=defaultBudgets(); saveLocal(); renderAll();
  closeModal('modal-confirm'); showToast('Alle data verwijderd');
  if(isOnline&&supabaseClient){try{await supabaseClient.from('transactions').delete().eq('device_key',deviceKey);}catch(e){}}
}
function toggleBalance(){
  balanceVisible=!balanceVisible;
  document.getElementById('balance-amount').classList.toggle('hidden',!balanceVisible);
  document.getElementById('balance-eye').setAttribute('icon',balanceVisible?'ph:eye-bold':'ph:eye-slash-bold');
}

// ============================================================
// HELPERS
// ============================================================
function setFilter(el,f){ txFilter=f; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); el.classList.add('active'); renderTransactions(); }
function filterTransactions(){ renderTransactions(); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function fmt(n){ return '€'+(parseFloat(n)||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function dateLabel(ds){
  const d=new Date(ds),t=new Date(),y=new Date(t);y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString())return'Vandaag';
  if(d.toDateString()===y.toDateString())return'Gisteren';
  if((t-d)/86400000<7)return'Deze week';
  return fullDate(ds);
}
function shortDate(ds){ return new Date(ds).toLocaleDateString('nl-NL',{day:'numeric',month:'short'}); }
function fullDate(ds){ return new Date(ds).toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}); }
function showToast(msg){ const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500); }
window.addEventListener('online',()=>{isOnline=true;setSyncIcon('sync');loadData();});
window.addEventListener('offline',()=>{isOnline=false;setSyncIcon('offline');});
<\/script>
